services:
  iotgps-camera-integration:
    image: 359703527435.dkr.ecr.ap-south-1.amazonaws.com/iotgps-camera-integration:${IMAGE_TAG:-latest}
    container_name: iotgps-camera-integration
    restart: unless-stopped
    ports:
      - "5005:5000"
    networks:
      - avls
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  avls:
    external: true
